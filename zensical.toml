[project]
site_name = "Haris Edge Docs"
site_url = "https://haris.oversight.ee/"
site_description = "Documentation for Haris Edge, the open MIT-licensed vessel-side component of the Haris platform: NMEA 0183, NMEA 2000 and Signal K collection, onboard normalization, and encrypted transport to shore."
site_author = "Project Haris"
docs_dir = "docs"
repo_url = "https://github.com/ahmdngi/haris.oversight.ee"
extra_css = ["stylesheets/extra.css"]
extra_javascript = ["javascripts/extra.js"]
nav = [
  {"Overview" = "index.md"},
  {"The Haris platform" = "platform.md"},
  {"Architecture" = "architecture.md"},
  {"Watchtower" = "watchtower.md"},
  {"Deployment" = "deployment.md"},
  {"Security" = "security.md"},
  {"Repos" = "repos.md"},
  {"FAQ" = "faq.md"},
]

[project.theme]
language = "en"
custom_dir = "overrides"
features = [
  "navigation.instant",
  "navigation.sections",
  "navigation.top",
  "content.code.copy",
  "search.suggest",
  "search.highlight",
]
palette = { scheme = "slate", primary = "custom", accent = "custom" }

[project.extra]
generator = false
